<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- stylesheet -->
    <link rel="stylesheet" href="styles.css" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Micro+5&family=Rowdies:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome -->
    <script
      src="https://kit.fontawesome.com/fb9f288e05.js"
      crossorigin="anonymous"
    ></script>

    <!-- favicon / logo of website -->

    <title>Sticky</title>
  </head>
  <body>
    <div class="main_container">
      <h1>Notes</h1>

      <div id="notes_container" class="notes-grid">
        <!-- wherenotes will be added -->
      </div>
      <div class="add_container">
        <div class="add_btn">
          <i class="fa-solid fa-plus" id="toggle_btn"></i>
        </div>
        <div id="toggle_bar" class="hidden">
          <div class="square" id="dark_pink"></div>
          <div class="square" id="blue"></div>
          <div class="square" id="peach"></div>
          <div class="square" id="orange"></div>
          <div class="square" id="navy"></div>
        </div>
      </div>
      <div id="app">
        <div class="sticky_area">
          <div id="sticky_titlebar" class="sticky_titlebar"></div>
          <!-- <textarea class="note" placeholder="Type your text here"></textarea> -->
        </div>
      </div>
    </div>
    <!-- javascript file -->
    <script src="main.js"></script>
  </body>
</html>
